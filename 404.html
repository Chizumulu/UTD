<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#033990">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 치주물루 유나이티드 FC 팬사이트</title>

<link rel="icon" href="/UTD/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/UTD/style.css?v=002">
<script>
  // 페이지 렌더링 전에 저장된 테마(또는 시스템 설정)를 즉시 적용해 깜빡임(FOUC)을 방지합니다.
  (function() {
    try {
      const saved = localStorage.getItem('nrfa-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>

<style>
  /* 토스식 에러 화면: 한 화면 한 메시지, 큰 제목, 하단 고정 전체 폭 버튼 (그라데이션·그림자·이모지 없음) */
  .page-404-wrap {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }
  .page-404-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 4px 24px;
  }
  .page-404-logo {
    width: 72px;
    height: 72px;
    margin-bottom: 28px;
  }
  .page-404-code {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-muted);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .page-404-title {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--color-text-darkest);
    margin: 0 0 12px;
    word-break: keep-all;
  }
  .page-404-desc {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--color-text-muted);
    margin: 0;
    word-break: keep-all;
  }
  .page-404-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 0 max(16px, env(safe-area-inset-bottom));
  }
  .page-404-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    border-radius: var(--radius-xl);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: var(--theme-transition), transform 0.12s ease;
  }
  .page-404-btn:active { transform: scale(0.97); }
  .page-404-btn-primary {
    background: var(--color-selected-bg);
    color: var(--color-selected-fg);
  }
  .page-404-btn-secondary {
    background: transparent;
    color: var(--color-text-muted);
    font-size: 15px;
    font-weight: 500;
  }
  .page-404-btn:focus-visible {
    outline: 2px solid var(--color-navy-light);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    .page-404-btn { transition: none; }
    .page-404-btn:active { transform: none; }
  }
</style>
</head>
<body>
<div class="container">
  <main class="page-404-wrap">
    <div class="page-404-body">
      <img class="page-404-logo" src="/UTD/dd.svg" alt="Chizumulu United FC">
      <div class="page-404-code">404</div>
      <h1 class="page-404-title">페이지를 찾을 수 없어요</h1>
      <p class="page-404-desc">주소가 바뀌었거나 삭제된 페이지예요.<br>메인에서 순위와 경기 일정을 확인해 보세요.</p>
    </div>
    <div class="page-404-actions">
      <a class="page-404-btn page-404-btn-primary" href="/UTD/">메인으로 돌아가기</a>
      <a class="page-404-btn page-404-btn-secondary" href="https://gall.dcinside.com/mgallery/board/lists/?id=chizumuluunitedfc" target="_blank" rel="noopener noreferrer">커뮤니티 바로가기</a>
    </div>
  </main>
</div>
</body>
</html>
