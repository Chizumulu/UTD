<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#033990">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 치주물루 유나이티드 FC 팬사이트</title>

<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=007">
<script>
  // 페이지 렌더링 전에 저장된 테마(또는 시스템 설정)를 즉시 적용해 깜빡임(FOUC)을 방지합니다.
  (function() {
    try {
      const saved = localStorage.getItem('nrfa-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>

<style>
  .page-404-wrap {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 20px 40px;
  }
  .page-404-logo {
    width: 96px;
    height: 96px;
    margin-bottom: 18px;
    filter: drop-shadow(0 4px 10px rgba(var(--color-navy-rgb),0.25));
  }
  .page-404-code {
    font-size: 56px;
    font-weight: 900;
    color: var(--color-navy);
    letter-spacing: 1px;
    line-height: 1;
    margin-bottom: 6px;
  }
  :root[data-theme="dark"] .page-404-code {
    color: var(--color-brand-text);
  }
  .page-404-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--color-text-dark);
    margin-bottom: 8px;
  }
  .page-404-desc {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--color-text-muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .page-404-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .page-404-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 11px 22px;
    border-radius: 22px;
    font-size: 13.5px;
    font-weight: 700;
    text-decoration: none;
    transition: var(--theme-transition), transform 0.15s;
  }
  .page-404-btn-primary {
    background: linear-gradient(135deg, var(--color-navy) 0%, var(--color-navy-light) 100%);
    color: var(--color-white);
    box-shadow: 0 6px 16px rgba(var(--color-navy-rgb),0.3);
  }
  .page-404-btn-secondary {
    background: var(--color-surface);
    color: var(--color-brand-text);
    box-shadow: 0 4px 12px rgba(var(--color-navy-rgb),0.12);
  }
  .page-404-btn:hover {
    transform: translateY(-1px);
  }
  .page-404-ball {
    font-size: 22px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="page-404-wrap">
    <img class="page-404-logo" src="./dd.svg" alt="Chizumulu United FC">
    <div class="page-404-ball">⚽</div>
    <div class="page-404-code">404</div>
    <div class="page-404-title">페이지를 찾을 수 없습니다</div>
    <p class="page-404-desc">
      요청하신 페이지가 삭제되었거나 주소가 변경되었을 수 있어요.<br>
      아래 버튼으로 팬사이트 메인으로 돌아가 보세요.
    </p>
    <div class="page-404-actions">
      <a class="page-404-btn page-404-btn-primary" href="./">메인으로 돌아가기</a>
      <a class="page-404-btn page-404-btn-secondary" href="https://gall.dcinside.com/mgallery/board/lists/?id=chizumuluunitedfc" target="_blank" rel="noopener noreferrer">커뮤니티 바로가기</a>
    </div>
  </div>
</div>
</body>
</html>
