name: UTD CLS layout comparison
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'scripts/build-pages.mjs'
      - 'scripts/initial-render.mjs'
      - 'scripts/initial-render.test.mjs'
      - 'scripts/early-hero.mjs'
      - 'scripts/early-hero.test.mjs'
      - 'scripts/cls-pr149-*.mjs'
      - '.github/workflows/cls-layout-comparison.yml'
  workflow_dispatch:
concurrency:
  group: cls-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    if: github.head_ref == 'ci/parallel-performance' || startsWith(github.head_ref, 'perf/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned baseline and exact candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cls-results"
          echo "RESULTS=$RUNNER_TEMP/cls-results" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/cls-results/candidate.txt"
          git worktree add --detach "$RUNNER_TEMP/cls-base" "${{ github.event.pull_request.base.sha || '1ac062a5cbfad401321ebd773a44955c015e1609' }}"
          python3 -m pip install Pillow==11.3.0
          npm install --no-save --package-lock=false terser@5.44.1 postcss@8.5.6 cssnano@7.1.2 lighthouse@12.8.2 playwright@1.56.1 pngjs@7.0.0 pixelmatch@7.1.0
          (cd "$RUNNER_TEMP/cls-base"; npm install --no-save --package-lock=false terser@5.44.1 postcss@8.5.6 cssnano@7.1.2; node scripts/build-pages.mjs "$RUNNER_TEMP/cls-before/UTD")
          node --test scripts/early-hero.test.mjs scripts/initial-render.test.mjs
          node scripts/build-pages.mjs "$RUNNER_TEMP/cls-after/UTD"
      - name: Archive exact build bytes
        run: |
          cd "$RUNNER_TEMP"
          tar -cf cls-build.tar cls-before cls-after cls-results/candidate.txt
          sha256sum cls-build.tar > cls-build.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cls-build
          path: |
            ${{ runner.temp }}/cls-build.tar
            ${{ runner.temp }}/cls-build.sha256
          retention-days: 3
  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        suite: [lighthouse, traces, desktop-traces, pixels]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cls-build
          path: ${{ runner.temp }}
      - name: Verify and restore shared build
        run: |
          cd "$RUNNER_TEMP"
          sha256sum -c cls-build.sha256
          tar -xf cls-build.tar
          test "$(cat cls-results/candidate.txt)" = "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "RESULTS=$RUNNER_TEMP/cls-results" >> "$GITHUB_ENV"
          mkdir -p cls-results
          { uname -a; lscpu; free -m; google-chrome --version; } > cls-results/runner.txt
          cd "$GITHUB_WORKSPACE"
          python3 -m pip install Pillow==11.3.0
          npm install --no-save --package-lock=false terser@5.44.1 postcss@8.5.6 cssnano@7.1.2 lighthouse@12.8.2 playwright@1.56.1 pngjs@7.0.0 pixelmatch@7.1.0
      - name: Compare Lighthouse, real CLS and pixels
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome)"
          google-chrome --version > "$RESULTS/chrome.txt"
          node scripts/lighthouse-comparison-server.mjs "$RUNNER_TEMP/cls-before" 8081 > "$RESULTS/server-before.log" 2>&1 &
          p1=$!
          node scripts/lighthouse-comparison-server.mjs "$RUNNER_TEMP/cls-after" 8082 > "$RESULTS/server-after.log" 2>&1 &
          p2=$!
          trap 'kill "$p1" "$p2" 2>/dev/null || true' EXIT
          for port in 8081 8082; do
            for i in {1..180}; do
              if curl -fsS "http://127.0.0.1:$port/UTD/" -o /dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/UTD/" -o /dev/null || { cat "$RESULTS"/server-*.log; exit 1; }
          done
          # Verify actual served bytes, not just a successful HTTP response.
          for side in before after; do
            if [ "$side" = before ]; then port=8081; else port=8082; fi
            for asset in index.html app.js data.js style.css publication.json; do
              test -s "$RUNNER_TEMP/cls-$side/UTD/$asset"
              curl --fail --silent --show-error --max-time 30 --compressed "http://127.0.0.1:$port/UTD/$asset" -o "$RESULTS/preflight-$side-$asset"
              cmp "$RUNNER_TEMP/cls-$side/UTD/$asset" "$RESULTS/preflight-$side-$asset"
            done
            curl --fail --silent --show-error --max-time 30 --compressed "http://127.0.0.1:$port/UTD/?lang=ko" -o "$RESULTS/preflight-$side-home.html"
            cmp "$RUNNER_TEMP/cls-$side/UTD/index.html" "$RESULTS/preflight-$side-home.html"
            node scripts/lighthouse-comparison-compression-check.mjs "$port" "$RESULTS/compression-$side.json"
            echo "Preflight passed: $side on $port"
          done
          case "${{ matrix.suite }}" in
            lighthouse) node scripts/cls-pr149-lighthouse.mjs "$RESULTS/lighthouse" "$GITHUB_WORKSPACE/scripts/lighthouse-comparison-flags.json" ;;
            traces) node scripts/cls-pr149-traces.mjs "$RESULTS/traces" ;;
            desktop-traces) UTD_CLS_DESKTOP=1 node scripts/cls-pr149-traces.mjs "$RESULTS/desktop-traces" ;;
            pixels) node scripts/cls-pr149-pixels.mjs "$RESULTS/pixels" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cls-part-${{ matrix.suite }}
          path: ${{ runner.temp }}/cls-results/
          retention-days: 30
  compare:
    if: always() && needs.build.result != 'skipped'
    needs: [build, measure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: cls-part-*
          path: parts
      - name: Assemble and validate all 72 measurements
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/cls-parallel-validate.py --test
          python3 scripts/cls-parallel-validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cls-layout-comparison
          path: combined/
          retention-days: 30
