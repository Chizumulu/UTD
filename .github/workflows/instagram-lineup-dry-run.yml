name: Instagram lineup dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-raiply-lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read and compare the official lineup
        env:
          UTD_INSTAGRAM_TOKEN: ${{ secrets.UTD_INSTAGRAM_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node automation/instagram-lineup/dry-run.mjs --live
