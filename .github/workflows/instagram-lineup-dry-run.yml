name: Instagram lineup dry run

on:
  workflow_dispatch:
  push:
    branches: [automation/chihame-ocr-trial]
    paths: ['automation/instagram-lineup/read-card.py']

permissions:
  contents: read

jobs:
  verify-chintheche-lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor python3-pil
      - name: Read and compare the official lineup
        env:
          UTD_INSTAGRAM_TOKEN: ${{ secrets.UTD_INSTAGRAM_TOKEN }}
        run: node automation/instagram-lineup/dry-run.mjs --live --chintheche
