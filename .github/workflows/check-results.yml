name: Inspect API results (dry run)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read API and print safe result proposals
        run: node scripts/sync-results.mjs --hours 168 --pages 20 --limit 50
