name: Admin center validation
on:
  pull_request:
    paths:
      - 'automation/admin-center/**'
      - 'automation/scorer-approval/worker.js'
      - '.github/workflows/credential-monitor.yml'
      - '.github/workflows/admin-center-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check automation/scorer-approval/worker.js
      - run: node --test automation/admin-center/*.test.mjs
