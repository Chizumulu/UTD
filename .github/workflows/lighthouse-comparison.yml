name: UTD Lighthouse comparison
on:
  pull_request:
    paths:
      - 'scripts/lighthouse-comparison*.mjs'
      - 'scripts/lighthouse-comparison-flags.json'
      - 'scripts/lighthouse-comparison-baseline.json'
      - 'scripts/lighthouse-pr-plan.json'
      - '.github/workflows/lighthouse-comparison.yml'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline commit SHA (40 hex characters)'
        required: true
        default: 'def5d8846167fcb2699ac5f416028e46afebe2d4'
      candidate:
        description: 'Candidate commit SHA (blank = selected workflow revision)'
        required: false
        default: ''
      runs:
        description: 'Runs per device per revision (3 or 5 recommended)'
        type: choice
        options: ['1', '3', '5']
        default: '5'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      BASE_INPUT: ${{ inputs.baseline || 'fb08f0af422bf811d4948669c31577db3ba710bd' }}
      HEAD_INPUT: ${{ inputs.candidate || (github.event_name == 'pull_request' && 'def5d8846167fcb2699ac5f416028e46afebe2d4') || github.sha }}
      RUNS: ${{ inputs.runs || '5' }}
    steps:
      - name: Initialize results directory
        run: |
          mkdir -p "$RUNNER_TEMP/lighthouse-results"
          echo "RESULTS=$RUNNER_TEMP/lighthouse-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate comparison helper
        run: node --test scripts/lighthouse-comparison.test.mjs scripts/lighthouse-comparison-server.test.mjs scripts/lighthouse-comparison-retry.test.mjs scripts/lighthouse-comparison-diagnostics.test.mjs scripts/lighthouse-comparison-baseline.test.mjs scripts/lighthouse-comparison-pr-plan.test.mjs
      - name: Resolve opt-in PR benchmark plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/lighthouse-comparison-pr-plan.mjs
      - name: Resolve revisions and build actual Pages artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_INPUT" =~ ^[0-9a-fA-F]{40}$ && "$HEAD_INPUT" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$RUNS" =~ ^(1|3|5)$ ]]
          git cat-file -e "$BASE_INPUT^{commit}"
          git cat-file -e "$HEAD_INPUT^{commit}"
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASE_INPUT"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$HEAD_INPUT"
          python3 -m pip install Pillow==11.3.0
          mkdir -p "$RUNNER_TEMP/site-before" "$RUNNER_TEMP/site-after" "$RESULTS"
          for side in before after; do
            if [[ "$side" == before ]]; then revision=baseline; else revision=candidate; fi
            (
              cd "$RUNNER_TEMP/$revision"
              npm install --no-save --package-lock=false terser@5.44.1 postcss@8.5.6 cssnano@7.1.2
              node scripts/build-pages.mjs "$RUNNER_TEMP/site-$side/UTD"
            )
          done
      - name: Validate lossless PNG and unchanged deployment assets
        if: env.BASE_INPUT == '0ffafd04b3e22461c7968a1322e065aa273acc46'
        run: |
          python3 scripts/test-optimize-player-png.py
          python3 scripts/verify-design-assets.py "$RUNNER_TEMP/site-before/UTD" "$RUNNER_TEMP/site-after/UTD"
      - name: Install pinned Lighthouse
        run: |
          npm install --no-save --package-lock=false lighthouse@12.8.2
          command -v google-chrome
          google-chrome --version
          ./node_modules/.bin/lighthouse --version
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {execFileSync} from "node:child_process"; import {cpus,platform,arch,release} from "node:os"; const cmd=(c,a)=>execFileSync(c,a,{encoding:"utf8"}).trim(); writeFileSync(process.env.RESULTS+"/environment.json",JSON.stringify({workflowSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,measuredAt:new Date().toISOString(),node:process.version,chrome:cmd("google-chrome",["--version"]),lighthouse:cmd("./node_modules/.bin/lighthouse",["--version"]),python:cmd("python3",["--version"]),runnerImage:process.env.ImageVersion??null,platform:platform(),arch:arch(),kernel:release(),cpu:cpus()[0]?.model,logicalCpus:cpus().length,throttling:"simulate",language:"ko",compression:"br/gzip/identity",cache:"no-store"},null,2));'
      - name: Serve both revisions and run paired mobile and desktop audits
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lighthouse-comparison-server.mjs "$RUNNER_TEMP/site-before" 8081 > "$RESULTS/server-before.log" 2>&1 &
          server_before=$!
          node scripts/lighthouse-comparison-server.mjs "$RUNNER_TEMP/site-after" 8082 > "$RESULTS/server-after.log" 2>&1 &
          server_after=$!
          trap 'kill "$server_before" "$server_after" 2>/dev/null || true' EXIT
          for port in 8081 8082; do
            for i in {1..180}; do
              if curl -fsS "http://127.0.0.1:$port/UTD/" -o /dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/UTD/" -o /dev/null
            node scripts/lighthouse-comparison-compression-check.mjs "$port" "$RESULTS/compression-$port.json"
          done
          export CHROME_PATH="$(command -v google-chrome)"
          for profile in mobile desktop; do
            for ((i=1;i<=RUNS;i++)); do
              if (( i % 2 == 1 )); then order=(before after); else order=(after before); fi
              for side in "${order[@]}"; do
                if [[ "$side" == before ]]; then port=8081; else port=8082; fi
                node scripts/lighthouse-comparison-retry.mjs "$RESULTS" "$profile" "$side" "$i" "$port" "$GITHUB_WORKSPACE/scripts/lighthouse-comparison-flags.json"
              done
            done
          done
      - name: Summarize medians and asset sizes
        run: |
          node scripts/lighthouse-comparison.mjs "$RESULTS" "$BASE_INPUT" "$HEAD_INPUT" "$RUNNER_TEMP/site-before/UTD" "$RUNNER_TEMP/site-after/UTD" "$RUNS"
          cat "$RESULTS/comparison.md" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RESULTS/diagnostics.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate fixed baseline reference
        run: |
          if [[ "$BASE_INPUT" == 'fb08f0af422bf811d4948669c31577db3ba710bd' && "$HEAD_INPUT" == 'def5d8846167fcb2699ac5f416028e46afebe2d4' && "$RUNS" == '5' ]]; then
            node scripts/lighthouse-comparison-baseline.mjs "$RESULTS"
            cat "$RESULTS/baseline.md" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Not the historical fixed pair; preserving existing baseline.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-comparison
          path: ${{ env.RESULTS }}/
          retention-days: 30
          if-no-files-found: warn
