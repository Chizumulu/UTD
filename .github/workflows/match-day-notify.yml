name: Match Day Notification

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 확인해 킥오프 1시간 전 알림을 정확히 보냅니다
  workflow_dispatch: {}

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send one-hour kickoff reminder
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node .github/scripts/check-match-day.js
