name: Match Day Notification

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 확인해 킥오프 1시간 전 알림을 보냅니다 (지연돼도 킥오프 전까지는 발송)
  workflow_dispatch: {}

# 실행이 겹쳐도 같은 경기에 알림이 두 번 나가지 않도록 한 번에 하나만 실행합니다.
concurrency:
  group: match-day-notifications
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Restore reminder state
        uses: actions/cache/restore@v5
        with:
          path: .kickoff-reminder-state.json
          key: kickoff-reminder-state-${{ github.run_id }}
          restore-keys: |
            kickoff-reminder-state-
      - name: Send one-hour kickoff reminder
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node .github/scripts/check-match-day.js
      - name: Save reminder state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .kickoff-reminder-state.json
          key: kickoff-reminder-state-${{ github.run_id }}
