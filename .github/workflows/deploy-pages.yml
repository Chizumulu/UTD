name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate league fixtures
        run: |
          node scripts/validate-fixtures.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Check site JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done
        shell: bash
      - name: Build site with content-based asset versions
        run: node scripts/build-pages.mjs "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
