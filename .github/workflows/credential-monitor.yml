name: UTD credential monitor
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: utd-credential-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.UTD_ADMIN_CENTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check protected credential report and manage incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ADMIN_KEY: ${{ secrets.UTD_ADMIN_CENTER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          title='[UTD 인증 감시] 인증 상태 확인 필요'
          report=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$report" "$body"' EXIT
          failed=0
          if [[ -z "$ADMIN_KEY" ]]; then
            echo 'Credential monitor key not configured.' >> "$report"
            failed=1
          elif curl --silent --fail --max-time 20 --retry 2 --retry-delay 3 -H "Authorization: Bearer $ADMIN_KEY" 'https://utd.likey00700.workers.dev/admin/dashboard/credentials' -o "$body" &&
            jq -e '.status == "ok" and (.checks|type=="array" and length==4) and ([.checks[].name]|sort)==["github_pat","instagram_token","whatsapp_phone","whatsapp_templates"]' "$body" >/dev/null; then
            echo 'Protected credential report received.' >> "$report"
            if ! jq -e 'all(.checks[]; .status=="valid" or .status=="disabled")' "$body" >/dev/null; then failed=1; fi
          else
            echo 'Credential report unavailable, stale or invalid.' >> "$report"
            failed=1
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --limit 100 --json title,number --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ "$failed" == 1 ]]; then
            # Public repository: do not publish credential names, expiry dates or diagnostic details.
            if [[ -z "$issue" ]]; then
              gh issue create --repo "$REPO" --title "$title" --body "관리센터 인증 점검에서 확인이 필요한 상태가 발견되었습니다. 관리자 페이지에서 상세 상태를 확인해 주세요."
            fi
            exit 1
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --repo "$REPO" --comment "자동 점검에서 정상 복구를 확인했습니다."
          fi
