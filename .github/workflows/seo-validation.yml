name: SEO pages validation
on:
  pull_request:
    paths:
      - 'data.js'
      - 'index.html'
      - 'scripts/build-pages.mjs'
      - 'scripts/crest-*.mjs'
      - 'scripts/generate-crest-assets.py'
      - 'scripts/test-crest-assets.py'
      - 'scripts/seo-pages*.mjs'
      - '.github/workflows/seo-validation.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - run: python3 scripts/test-crest-assets.py
      - run: node --test scripts/crest-templates.test.mjs scripts/seo-pages.test.mjs
      - run: node scripts/build-pages.mjs "$RUNNER_TEMP/pages"
