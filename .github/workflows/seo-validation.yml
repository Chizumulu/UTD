name: SEO pages validation
on:
  pull_request:
    paths:
      - 'data.js'
      - 'index.html'
      - 'scripts/build-pages.mjs'
      - 'scripts/early-hero*.mjs'
      - 'scripts/standings-export-split*.mjs'
      - 'scripts/season-compare-split*.mjs'
      - 'scripts/team-match-compare-split*.mjs'
      - 'scripts/player-modal-split*.mjs'
      - 'scripts/match-detail-split*.mjs'
      - 'scripts/venue-map-split*.mjs'
      - 'match-alert-onboarding.js'
      - 'scripts/match-alert-onboarding.test.mjs'
      - 'scripts/app-layout*.mjs'
      - 'scripts/initial-render*.mjs'
      - 'scripts/font-delivery*.mjs'
      - 'scripts/external-script-delivery*.mjs'
      - 'fonts/**'
      - 'scripts/minify-pages-assets*.mjs'
      - 'scripts/crest-*.mjs'
      - 'scripts/generate-crest-assets.py'
      - 'scripts/test-crest-assets.py'
      - 'scripts/seo-pages*.mjs'
      - '.github/workflows/seo-validation.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - run: npm install --no-save --package-lock=false terser@5.44.1 postcss@8.5.6 cssnano@7.1.2
      - run: python3 scripts/test-crest-assets.py
      - run: node --test scripts/crest-templates.test.mjs scripts/seo-pages.test.mjs scripts/minify-pages-assets.test.mjs scripts/font-delivery.test.mjs scripts/external-script-delivery.test.mjs scripts/initial-render.test.mjs scripts/app-layout.test.mjs scripts/early-hero.test.mjs scripts/standings-export-split.test.mjs scripts/season-compare-split.test.mjs scripts/team-match-compare-split.test.mjs scripts/player-modal-split.test.mjs scripts/match-detail-split.test.mjs scripts/venue-map-split.test.mjs scripts/match-alert-onboarding.test.mjs
      - run: node scripts/build-pages.mjs "$RUNNER_TEMP/pages"
