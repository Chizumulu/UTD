name: Approved forfeit proposal
on:
  repository_dispatch:
    types: [forfeit-proposal-approved]
concurrency:
  group: approved-scorer-proposals-main
  queue: max
permissions:
  contents: read
jobs:
  publish:
    if: github.event.client_payload.proposal.kind == 'forfeit' && github.event.client_payload.proposal.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SCORER_GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false acorn@8
      - name: Save approved proposal
        run: |
          mkdir -p work
          node -e "const e=require(process.env.GITHUB_EVENT_PATH); require('node:fs').writeFileSync('work/scorer-proposal.json', JSON.stringify(e.client_payload.proposal));"
      - name: Publish approved forfeit
        env:
          GH_TOKEN: ${{ secrets.SCORER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            node automation/forfeit-approval/apply-forfeit.mjs
            node --check data.js
            git add -- data.js automation/cup-sync/cup-snapshot.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Apply approved match forfeit'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
          done
          git fetch origin main
          git checkout -B main origin/main
          node automation/forfeit-approval/apply-forfeit.mjs
          node --check data.js
          git add -- data.js automation/cup-sync/cup-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply approved match forfeit'
          branch="automation/forfeit-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Apply approved match forfeit' --body 'Approved in WhatsApp; direct push failed after retries. Review before merging.'
      - name: Record publication receipt
        if: success()
        run: |
          node scripts/publication-receipt.mjs "$RUNNER_TEMP/publication-receipt.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/publication-receipt.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error
