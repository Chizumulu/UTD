name: UTD A isolation 80
on:
  pull_request:
    paths:
      - '.github/workflows/a-isolation.yml'
      - 'scripts/a-isolation-lighthouse.mjs'
      - 'scripts/initial-render.mjs'
      - 'scripts/deferred-stats.mjs'
      - 'scripts/build-pages.mjs'
      - 'scripts/venue-map-split.mjs'
      - 'scripts/club-extras-split.mjs'
permissions:
  contents: read
concurrency:
  group: a-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  measure:
    if: github.head_ref == 'perf/data-lcp-startup'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build five variants and measure 40 samples
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a-results"
          git rev-parse HEAD > "$RUNNER_TEMP/a-results/sha.txt"
          python3 -m pip install Pillow==11.3.0
          npm install --no-save --package-lock=false terser@5.44.1 postcss@8.5.6 cssnano@7.1.2 lighthouse@12.8.2 playwright@1.56.1 pngjs@7.0.0 pixelmatch@7.1.0
          export CHROME_PATH="$(command -v google-chrome)"
          { lscpu; google-chrome --version; } > "$RUNNER_TEMP/a-results/runner.txt"
          port=8081
          git worktree add --detach "$RUNNER_TEMP/a-base" "${{ github.event.pull_request.base.sha }}"
          (cd "$RUNNER_TEMP/a-base"; npm install --no-save --package-lock=false terser@5.44.1 postcss@8.5.6 cssnano@7.1.2; node scripts/build-pages.mjs "$RUNNER_TEMP/a-A/UTD")
          for group in A B C D E; do
            if [ "$group" != A ]; then UTD_A_ISOLATION_GROUP="$group" node scripts/build-pages.mjs "$RUNNER_TEMP/a-$group/UTD"; fi
            node scripts/lighthouse-comparison-server.mjs "$RUNNER_TEMP/a-$group" "$port" > "$RUNNER_TEMP/a-results/server-$group.log" 2>&1 &
            for i in {1..60}; do
              if curl -fsS "http://127.0.0.1:$port/UTD/" -o /dev/null; then break; fi
              sleep 1
            done
            for asset in index.html app.js data.js style.css publication.json; do
              curl -fsS --compressed "http://127.0.0.1:$port/UTD/$asset" -o "$RUNNER_TEMP/a-results/$group-$asset"
              cmp "$RUNNER_TEMP/a-$group/UTD/$asset" "$RUNNER_TEMP/a-results/$group-$asset"
            done
            node scripts/lighthouse-comparison-compression-check.mjs "$port" "$RUNNER_TEMP/a-results/compression-$group.json"
            port=$((port+1))
          done
          node scripts/a-isolation-lighthouse.mjs "$RUNNER_TEMP/a-results" "${{ matrix.profile }}" "$GITHUB_WORKSPACE/scripts/lighthouse-comparison-flags.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-isolation-${{ matrix.profile }}
          path: ${{ runner.temp }}/a-results/
          retention-days: 30
