name: Data writer queue validation
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/data-write-queue.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/data-write-queue.test.mjs
